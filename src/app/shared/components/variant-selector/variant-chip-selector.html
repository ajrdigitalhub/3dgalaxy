<!-- Variant Chip Selector — Premium Choice Chips UI -->
@for (group of optionGroups; track trackByGroup($index, group)) {
<div class="variant-chip-group">
  <!-- Group Label -->
  <h4 class="variant-chip-label">
    {{ group.name }}:
    @if (selectedOptions[group.name]) {
      <span class="variant-chip-label-value">{{ selectedOptions[group.name] }}</span>
    }
  </h4>

  <!-- Chips Row -->
  <div class="variant-chips-row"
       role="radiogroup"
       [attr.aria-label]="'Select ' + group.name">
    @for (val of group.values; track trackByValue($index, val)) {
      <button type="button"
              role="radio"
              class="variant-chip"
              [class.variant-chip--selected]="isSelected(group.name, val)"
              [class.variant-chip--disabled]="isOutOfStock(group.name, val)"
              [attr.aria-checked]="isSelected(group.name, val)"
              [attr.aria-disabled]="isOutOfStock(group.name, val)"
              [attr.aria-label]="val + (isOutOfStock(group.name, val) ? ' - Currently unavailable' : '')"
              [tabindex]="isSelected(group.name, val) ? 0 : -1"
              [disabled]="isOutOfStock(group.name, val)"
              [matTooltip]="isOutOfStock(group.name, val) ? 'Currently unavailable' : ''"
              matTooltipPosition="above"
              (click)="onChipClick(group.name, val)"
              (keydown)="onKeydown($event, group.name, val, group.values)">

        <!-- Check Icon (Selected State) -->
        @if (isSelected(group.name, val)) {
          <mat-icon class="variant-chip-check">check</mat-icon>
        }

        <!-- Color Dot (Color Groups Only) -->
        @if (isColorGroup(group.name)) {
          <span class="variant-chip-color-dot"
                [style.backgroundColor]="getColorCode(val)"></span>
        }

        <!-- Label -->
        <span class="variant-chip-text"
              [class.variant-chip-text--strike]="isOutOfStock(group.name, val)">
          {{ val }}
        </span>

        <!-- Out of Stock Badge -->
        @if (isOutOfStock(group.name, val)) {
          <span class="variant-chip-oos-badge">Out of Stock</span>
        }
      </button>
    }
  </div>
</div>
}
